[package]
name = "iets"
version = "0.2.0"
license = "LGPL-2.1-or-later"
edition = "2024"
[[bin]]
name = "iets"
path = "src/main.rs"
[dependencies]
sha2 = "0.11"
blake3 = "1"
crc32fast = "1"
sha1 = "0.11"
md-5 = "0.11"
libc = "0.2"
rustix = { version = "1", features = ["fs", "mm", "net", "param", "thread", "process", "termios"] }
memchr = "2"
getrandom = "0.4"
tempfile = "3"
toml = "1"
serde_json = "1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "transport", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
zstd = "0.14"
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-encode", "safe-decode"] }
# The flake-input fetcher (src/fetch/http.rs, src/fetch/unpack.rs): the HTTP and
# TLS halves are the ones tonic already brings; only the archive formats are new.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# the CA roots when the machine has none (src/fetch/roots.rs)
webpki-roots = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }
bzip2 = "0.6"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# Memory census behind IETS_STATS=2 (docs/reference/settings.md); off the hot path when unset.
stats2 = []

[build-dependencies]
sha2 = "0.11"
tonic-prost-build = "0.14"
protox = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
debug = 1
[profile.bench]
inherits = "release"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }

[lints.rust]
# cargo fuzz builds with `--cfg fuzzing` (src/sys/mod.rs, `elapsed`)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
