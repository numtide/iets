name: bench

on:
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Build the base with the candidate's locked inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=${BASE:-$(git rev-list -1 --first-parent --before="1 week ago" HEAD)}
          nix build "git+file://$PWD?rev=$BASE#default" -o result-base --inputs-from . \
            --override-input nixpkgs flake:nixpkgs --override-input crane flake:crane
      - if: github.event_name == 'pull_request'
        run: sudo sysctl kernel.perf_event_paranoid=2
      - name: Compare native performance and Callgrind instructions
        shell: bash
        env:
          SUITE: ${{ github.event_name == 'schedule' && '--ramdisk' || '' }}
        run: nix run .#bench-compare -- result-base/bin/iets "$SUITE" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ab
          path: |
            ab.json
            target/gungraun
