name: bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Build the benchmark environment
        run: |
          nix build .#default --out-link result-candidate
          nix build .#bench-ab --out-link result-ab
          nix build .#bench-callgrind --out-link result-callgrind
          nix build .#bench-report --out-link result-report
      # Use the candidate's locked toolchain for both sides, even when the
      # base has an older flake.lock. No host Cargo or floating stable Rust.
      - name: Build the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          crane=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.crane.outPath')
          nix build "path:$RUNNER_TEMP/base#default" --out-link result-base \
            --override-input nixpkgs "path:$nixpkgs" \
            --override-input crane "path:$crane"
      # Ubuntu forbids perf counters to users by default
      - run: sudo sysctl kernel.perf_event_paranoid=2
      # Compare alternating pairs; report confidence intervals in the summary.
      - name: Compare
        run: |
          ./result-ab/bin/iets-bench-ab ./result-base/bin/iets \
            ./result-candidate/bin/iets --threshold 5 --json ab.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare instructions on evaluation and component workloads
        run: |
          IETS_BENCH_BIN="$PWD/result-base/bin/iets" \
            ./result-callgrind/bin/iets-bench-callgrind --save-baseline=base --save-summary=json
          ./result-callgrind/bin/iets-bench-callgrind \
            --baseline=base --callgrind-limits='Ir=5%' --save-summary=json
      - name: Summarize benchmark and thread counts
        if: ${{ !cancelled() }}
        run: |
          if test -x result-report/bin/iets-bench-report && test -d target/gungraun; then
            ./result-report/bin/iets-bench-report target/gungraun >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ab
          path: |
            ab.json
            target/gungraun
