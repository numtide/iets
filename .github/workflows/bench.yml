name: bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Build the base with the candidate's locked inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >
          nix build "git+file://$PWD?rev=$BASE#default" -o result-base --inputs-from .
          --override-input nixpkgs flake:nixpkgs --override-input crane flake:crane
      - run: sudo sysctl kernel.perf_event_paranoid=2
      - name: Compare native performance and Callgrind instructions
        shell: bash
        run: nix run .#bench-compare -- result-base/bin/iets | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ab
          path: |
            ab.json
            target/gungraun
