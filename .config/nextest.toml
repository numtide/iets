# A hung test fails in minutes, well inside the time CI gives a check, and
# not at the builder's silence timeout. The limits are about twice the
# longest runs seen on a loaded builder.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# whole-nixpkgs evaluations
[[profile.default.overrides]]
filter = "binary(nixpkgs_eval) | test(=nix_search_nixpkgs)"
slow-timeout = { period = "60s", terminate-after = 8 }

# each case runs up to 8 evaluator workers
[[profile.default.overrides]]
filter = "test(/concurrent_eval_matches_sequential_eval/)"
threads-required = 4
